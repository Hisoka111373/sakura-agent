name: Build Sakura Agent APK

on:
  push:
    branches: [ main, 'copilot/**', 'feature/**' ]
    paths-ignore: [ 'apk/**' ]
  pull_request:
    branches: [ main ]
    paths-ignore: [ 'apk/**' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch pinned llama.cpp
        run: bash scripts/fetch-llama.sh

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install Android native toolchain
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "cmake;3.31.6" "ndk;27.2.12479018"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug APK (ARM64)
        run: ./gradlew --no-daemon assembleDebug

      - name: Verify native CPU optimization
        run: |
          python3 - <<'PY'
          import json, pathlib, shlex
          rows = []
          for p in pathlib.Path('app/.cxx').rglob('compile_commands.json'):
              rows.extend(json.loads(p.read_text()))
          native = [r for r in rows if 'ggml' in r['file'] or 'llama' in r['file'] or r['file'].endswith('sakura_llm.cpp')]
          assert native, 'No native compile commands found'
          for r in native:
              flags = [x for x in shlex.split(r['command']) if x.startswith('-O')]
              assert '-O3' in flags, f'Native source not optimized: {r["file"]}, {flags}'
          print(f'PASS: {len(native)} native compile commands use effective -O3, including llama/ggml')
          source = pathlib.Path('app/src/main/cpp/sakura_llm.cpp').read_text()
          for token in ('LLAMA_FLASH_ATTN_TYPE_ENABLED', 'GGML_TYPE_Q8_0', 'nativeWarmup', 'nativeRuntimeInfo'):
              assert token in source, f'Missing native optimization: {token}'
          print('PASS: Flash Attention, Q8_0 KV cache, warm-up and runtime info are present')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: sakura-agent-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      # Publish the verified APK as a GitHub Release instead of committing it to main.
      # The build job keeps contents: write only for this release step.
      - name: Prepare release notes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: release_info
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)"
          test -n "$VERSION" && test "$VERSION" != "0.0"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          {
            echo "## Sakura $VERSION"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- CI: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- Tamaño: $(stat -c%s app/build/outputs/apk/debug/app-debug.apk) bytes"
            echo "- SHA-256: \`$(sha256sum app/build/outputs/apk/debug/app-debug.apk | cut -d' ' -f1)\`"
            echo
            echo "APK debug ARM64/Android 13+. Sin prueba física; conserva tus datos antes de actualizar."
          } > release-notes.md

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.release_info.outputs.version }}
          name: Sakura ${{ steps.release_info.outputs.version }}
          body_path: release-notes.md
          files: app/build/outputs/apk/debug/app-debug.apk
